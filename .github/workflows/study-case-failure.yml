name: Study Case - Pipeline Failure Scenario

on:
  workflow_dispatch: {}

jobs:
  simulate-failure-code-quality:
    name: Code Quality Failure (Pylint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          
      - name: Run Pylint with Low Score
        run: |
          echo "Running Pylint check..."
          echo "Your code has been rated at 6.5/10"
          echo ""
          echo "ERRORS FOUND:"
          echo "  - Missing docstrings in functions"
          echo "  - Line too long (120/100)"
          echo "  - Unused imports detected"
          echo ""
          echo "❌ FAILURE: Pylint score below threshold (9.0)"
          exit 1

  simulate-failure-security:
    name: Security Scan Failure (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Semgrep with Findings
        run: |
          echo "Running Semgrep SAST scan..."
          echo ""
          echo "⚠️  SECURITY FINDINGS:"
          echo "  1. Hardcoded credentials detected in app.py"
          echo "  2. SQL injection vulnerability in line 45"
          echo "  3. XSS vulnerability in template rendering"
          echo ""
          echo "❌ FAILURE: Critical security vulnerabilities detected"
          echo "Pipeline blocked for security reasons"
          exit 1

  simulate-failure-dependency:
    name: Dependency Audit Failure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Simulate Vulnerable Dependencies
        run: |
          echo "Running pip-audit..."
          echo ""
          echo "🚨 VULNERABLE DEPENDENCIES FOUND:"
          echo "  - flask 3.1.3: CVE-2024-12345 (CRITICAL)"
          echo "  - werkzeug 3.1.9: CVE-2024-67890 (HIGH)"
          echo "  - jinja2 3.1.6: CVE-2024-54321 (MEDIUM)"
          echo ""
          echo "❌ FAILURE: Vulnerable dependencies detected"
          echo "Update packages before deployment"
          exit 1

  simulate-failure-tests:
    name: Unit Test Failure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          
      - name: Run Failing Tests
        run: |
          echo "Running unit tests..."
          echo ""
          echo "FAILED TESTS:"
          echo "  test_home_route - AssertionError: Expected 'Welcome' but got 'Selamat Datang'"
          echo "  test_health_endpoint - ConnectionRefusedError: Cannot connect to app"
          echo "  test_database_connection - TimeoutError: Database connection failed"
          echo ""
          echo "❌ FAILURE: 3 tests failed out of 10"
          echo "Test coverage: 65% (below threshold 80%)"
          exit 1

  simulate-failure-deployment:
    name: Deployment Failure (VM Connection)
    runs-on: ubuntu-latest
    needs: [simulate-failure-code-quality, simulate-failure-security, simulate-failure-dependency, simulate-failure-tests]
    if: always()
    steps:
      - name: Attempt VM Connection
        run: |
          echo "Attempting to connect to VM..."
          echo "❌ FAILURE: Cannot connect to 192.168.238.132"
          echo "Possible issues:"
          echo "  - VM is down or unreachable"
          echo "  - SSH key authentication failed"
          echo "  - Network connectivity issues"
          echo ""
          echo "⚠️  DEPLOYMENT BLOCKED: VM connection failed"
          
      - name: Failure Analysis Report
        if: always()
        run: |
          echo "========================================"
          echo "PIPELINE FAILURE SCENARIO - ANALYSIS"
          echo "========================================"
          echo ""
          echo "🔴 FAILURE SUMMARY:"
          echo "   1. Code Quality: Pylint score 6.5/10 (threshold 9.0)"
          echo "   2. Security: Critical vulnerabilities detected"
          echo "   3. Dependencies: 3 vulnerable packages found"
          echo "   4. Tests: 3 tests failed, coverage 65%"
          echo "   5. Deployment: VM connection failed"
          echo ""
          echo "📋 RECOMMENDED ACTIONS:"
          echo "   1. Fix code quality issues (add docstrings, fix line length)"
          echo "   2. Address security vulnerabilities"
          echo "   3. Update vulnerable dependencies"
          echo "   4. Fix failing unit tests"
          echo "   5. Check VM connectivity and credentials"
          echo ""
          echo "⏱️  TIMELINE:"
          echo "   - Code Quality Check: Failed at 0:45"
          echo "   - Security Scan: Failed at 1:15"
          echo "   - Dependency Audit: Failed at 1:45"
          echo "   - Unit Tests: Failed at 2:30"
          echo "   - Deployment: Blocked at 3:00"
          echo ""
          echo "🎯 OUTCOME:"
          echo "   Pipeline failed in early stages"
          echo "   Application NOT deployed to production"
          echo "   Security and quality gates effective"
          echo "========================================"