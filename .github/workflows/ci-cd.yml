name: ATS-CI-CD 2-Stage Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # JOB 1: CI (Continuous Integration)
    # ==========================================
    ci-job:
        name: CI - Lint, Security & Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Pip & Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit
                  pip install -r requirements.txt

            - name: 1. Quality Check (Pylint)
              run: |
                  export PATH=$PATH:$HOME/.local/bin
                  pylint --fail-under=9.0 app.py

            - name: 2. Dependency Check (pip-audit)
              run: |
                  export PATH=$PATH:$HOME/.local/bin
                  pip-audit --requirement requirements.txt --no-deps

            - name: 3. Unit Testing (pytest)
              run: |
                  export PATH=$PATH:$HOME/.local/bin
                  pytest tests/

            - name: 4. Build Docker Image
              run: |
                  docker build -t ats-flask-app:latest .

    # ==========================================
    # JOB 2: CD (Continuous Deployment)
    # ==========================================
    cd-job:
        name: CD - Deploy & Health Check
        needs: ci-job
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: 1. Build & Run Container
              run: |
                  docker build -t ats-flask-app:latest .
                  docker rm -f ats-web-flask web-flask || true
                  docker run -d -p 5000:5000 --name ats-web-flask --restart unless-stopped ats-flask-app:latest

            - name: 2. Container Health Check
              run: |
                  echo "Checking container running state..."
                  RUNNING=$(docker inspect --format='{{.State.Running}}' ats-web-flask)
                  if [ "$RUNNING" != "true" ]; then
                      echo "ERROR: Container is not running."
                      exit 1
                  fi

                  echo "Checking HTTP endpoint health..."
                  for i in {1..5}; do
                      if curl -sSf http://localhost:5000/health; then
                          echo "Application health check PASSED!"
                          exit 0
                      fi
                      echo "Waiting for app to start ($i/5)..."
                      sleep 2
                  done
                  echo "ERROR: Health check failed."
                  exit 1

            - name: 3. Cleanup Dangling Docker Images
              run: |
                  docker image prune -f
                  echo "Pipeline CI/CD completed successfully!"
