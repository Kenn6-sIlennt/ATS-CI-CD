name: ATS-CI-CD Self-Hosted Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # CI & CD Pipeline on Self-Hosted Runner
    # ==========================================
    pipeline-on-server:
        name: ATS CI/CD Self-Hosted Execution
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: 1. Setup Python & Install Dependencies
              run: |
                  python3 -m pip install --upgrade pip
                  pip3 install -r requirements.txt

            - name: 2. Quality Check (Pylint)
              run: |
                  pylint --fail-under=9.0 app.py

            - name: 3. Dependency Check (pip-audit)
              run: |
                  pip-audit --requirement requirements.txt

            - name: 4. Unit Testing (pytest)
              run: |
                  pytest tests/

            - name: 5. Build Docker Image
              run: |
                  docker build -t ats-flask-app:latest .

            - name: 6. Deploy & Run Container
              run: |
                  echo "Force removing existing container..."
                  docker rm -f ats-web-flask web-flask || true
                  
                  echo "Running new container..."
                  docker run -d -p 5000:5000 --name ats-web-flask --restart unless-stopped ats-flask-app:latest

            - name: 7. Container Health Check
              run: |
                  echo "Checking container state..."
                  RUNNING=$(docker inspect --format='{{.State.Running}}' ats-web-flask)
                  if [ "$RUNNING" != "true" ]; then
                      echo "ERROR: Container not running."
                      exit 1
                  fi

                  echo "Checking HTTP endpoint..."
                  for i in {1..5}; do
                      if curl -sSf http://localhost:5000/health; then
                          echo "Health check PASSED!"
                          exit 0
                      fi
                      echo "Waiting for app ($i/5)..."
                      sleep 2
                  done
                  echo "ERROR: Health check failed."
                  exit 1

            - name: 8. Cleanup Dangling Docker Images
              run: |
                  docker image prune -f
                  echo "Pipeline executed successfully on self-hosted runner!"
