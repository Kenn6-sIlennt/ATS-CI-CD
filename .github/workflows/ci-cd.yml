name: ATS-CI-CD Pipeline

on:
    push:
        branches: ["main", "master"]
    pull_request:
        branches: ["main", "master"]
    workflow_dispatch: {}

jobs:
    # ==========================================
    # STAGE 1: CI (Continuous Integration)
    # ==========================================
    continuous-integration:
        name: CI - Quality, Security & Testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Install Dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: 1. Quality Check (Pylint)
              run: |
                  pylint --fail-under=9.0 app.py

            - name: 2. Dependency Check (pip-audit)
              run: |
                  pip-audit --requirement requirements.txt

            - name: 3. Unit Testing (pytest)
              run: |
                  pytest tests/

            - name: 4. Build Docker Image
              run: |
                  docker build -t ats-flask-app:latest .

            - name: 5. Scan Docker Image (Trivy)
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: 'ats-flask-app:latest'
                  format: 'table'
                  exit-code: '0'
                  severity: 'CRITICAL,HIGH'

    # ==========================================
    # STAGE 2: CD (Continuous Deployment)
    # ==========================================
    continuous-deployment:
        name: CD - Deploy to Server & Health Check
        needs: continuous-integration
        runs-on: self-hosted
        steps:
            - name: Checkout Source Code
              uses: actions/checkout@v4

            - name: 1. Server Pull / Build & Run Container
              run: |
                  echo "Building Docker container on server..."
                  docker build -t ats-flask-app:latest .
                  
                  echo "Force removing existing container if running..."
                  docker rm -f ats-web-flask web-flask || true
                  
                  echo "Running new container with restart policy..."
                  docker run -d -p 5000:5000 --name ats-web-flask --restart unless-stopped ats-flask-app:latest

            - name: 2. Container Health Check
              run: |
                  echo "Checking container running state..."
                  RUNNING=$(docker inspect --format='{{.State.Running}}' ats-web-flask)
                  if [ "$RUNNING" != "true" ]; then
                      echo "ERROR: Container is not running."
                      exit 1
                  fi

                  echo "Checking HTTP endpoint health..."
                  for i in {1..5}; do
                      if curl -sSf http://localhost:5000/health; then
                          echo "Application health check PASSED!"
                          exit 0
                      fi
                      echo "Waiting for app to start ($i/5)..."
                      sleep 2
                  done
                  echo "ERROR: Health check failed."
                  exit 1

            - name: 3. Cleanup Old Docker Images
              run: |
                  echo "Cleaning up dangling/old Docker images..."
                  docker image prune -f
                  echo "CD Pipeline completed successfully."
